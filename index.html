<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visbord Family Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <span class="topbar-title">🏠 Family Dashboard</span>
        <button class="tabs-toggle" id="tabs-toggle" aria-controls="tabs-nav" aria-expanded="true">Hide menu ▲</button>
    </header>
    <nav class="tabs" id="tabs-nav">
        <button class="tab active" data-page="grandma">👵 Grandma Countdown</button>
        <button class="tab" data-page="routines">⏰ Routines</button>
        <button class="tab" data-page="game">🎮 Capybara Game</button>
        <button class="tab" data-page="warmup">🏋️ Warm-Up</button>
        <button class="tab" data-page="math-game">🎓 Math Adventure</button>
        <button class="tab" data-page="reading-game">📖 Reading & Spelling</button>
        <button class="tab" data-page="lister">🧳 Lister</button>
        <button class="tab" data-page="game-roulette">🎰 Game Roulette</button>
        <button class="tab" data-page="bathtub-roulette">🛁 Bathtub Roulette</button>
    </nav>

    <div class="content">
        <!-- Pages will be loaded dynamically from pages/ directory -->
    </div>

    <!-- Core Infrastructure (MUST load first) -->
    <script src="js/core/router.js"></script>

    <!-- Feature Modules (order doesn't matter) -->
    <script src="js/modules/countdown.js"></script>
    <script src="js/modules/capybara-game.js"></script>
    <script src="js/modules/warmup-calculator.js"></script>
    <script src="js/modules/routine-timer.js"></script>
    <script src="js/modules/lister.js"></script>
    <!-- Roulette engine must load before the tabs that build on it -->
    <script src="js/modules/roulette-engine.js"></script>
    <script src="js/modules/game-roulette.js"></script>
    <script src="js/modules/bathtub-roulette.js"></script>

    <!-- Reading Game Modules (load order matters for dependencies) -->
    <script src="js/modules/reading-game-data.js"></script>
    <script src="js/modules/reading-game-storage.js"></script>
    <script src="js/modules/reading-game-audio.js"></script>
    <script src="js/modules/reading-game-api.js"></script>
    <script src="js/modules/reading-game-state.js"></script>
    <script src="js/modules/reading-game-ui.js"></script>
    <script src="js/modules/reading-game-main.js"></script>

    <!-- Application Entry Point (initializes modules) -->
    <script src="app.js"></script>

    <!-- Math Game - Modular Files (load order matters for dependencies) -->
    <script src="js/math-game/math-game-data.js"></script>
    <script src="js/math-game/math-game-storage.js"></script>
    <script src="js/math-game/math-game-audio.js"></script>
    <script src="js/math-game/math-game-profiles.js"></script>
    <script src="js/math-game/math-game-levels.js"></script>
    <script src="js/math-game/math-game-engine.js"></script>
    <script src="js/math-game/math-game-puzzle.js"></script>
    <script src="js/math-game/math-game-ui.js"></script>
    <script src="js/math-game/math-game-main.js"></script>
</body>
</html>
